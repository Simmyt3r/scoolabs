name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript, unit tests and web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check source
        run: npm run typecheck
      - name: Test scientific simulation engines
        run: npm test
      - name: Build offline frontend assets
        run: npm run build
      - name: Install browser used for student smoke tests
        run: npx playwright install --with-deps chromium
      - name: Run student workflow browser tests
        run: npm run test:e2e
      - name: Upload browser diagnostics if tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scoolabs-playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: scoolabs-frontend
          path: dist/
          retention-days: 7
