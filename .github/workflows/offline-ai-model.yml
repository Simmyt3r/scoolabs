name: Acquire optional offline AI model candidate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/offline-ai-model.yml'
      - 'scripts/fetch-offline-model.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scoolabs-optional-offline-model
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download pinned-checksum ONNX model, tokenizer and attribution
        run: python scripts/fetch-offline-model.py --download --check
      - name: Preserve audited candidate as a separate artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scoolabs-Optional-AI-Model-Candidate
          path: model-candidate-artifacts/
          if-no-files-found: error
          retention-days: 30
