[package]
name = "scoolabs"
version = "0.9.0"
description = "Scoolabs offline virtual science laboratory"
authors = ["Simeon's Laboratories and Co Technologies Ltd"]
license = "Proprietary"
edition = "2021"

[lib]
name = "scoolabs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
argon2 = "0.5"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
