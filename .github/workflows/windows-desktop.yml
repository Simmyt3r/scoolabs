name: Windows desktop installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build standalone Windows installer
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install npm packages
        run: npm install --no-audit --no-fund
      - name: Test mathematical simulation engines
        run: npm test
      - name: Type-check and bundle frontend
        run: npm run build
      - name: Build Tauri Windows installer
        run: npm run tauri build
      - name: Run native SQLite and teacher authentication tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Publish installer as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scoolabs-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Attach installer to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
