name: Windows desktop installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  pull_request:

concurrency:
  group: scoolabs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: write

jobs:
  windows:
    name: Build standalone Windows installer
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install npm packages
        run: npm install --no-audit --no-fund
      - name: Verify source science datasets before packaging
        shell: pwsh
        run: |
          python scripts/sync-science-data.py --check
          python scripts/sync-pubchem.py --check
          python scripts/sync-taxonomy.py --check
          python scripts/prepare-installer-assets.py --validate-source
      - name: Download and audit the offline MiniLM model and tokenizer
        run: python scripts/fetch-offline-model.py --download --check
      - name: Embed AI weights, tokenizer and all science datasets into desktop resources
        run: python scripts/prepare-installer-assets.py --prepare --check
      - name: Test scientific simulations and offline search ranking
        run: npm test
      - name: Type-check application including local AI runtime
        run: npm run typecheck
      - name: Bundle browser interface with local ONNX weights and WASM
        run: npm run build
      - name: Generate and validate Scoolabs Windows branding
        run: |
          npm run brand:icons
          node scripts/verify-brand.mjs
      - name: Test Tauri native implementation
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Tauri Windows installer with embedded offline resources
        run: npm run tauri build
      - name: Recheck resource checksums after building installer
        run: python scripts/prepare-installer-assets.py --check
      - name: Inspect finished NSIS installer for AI and science resources
        shell: pwsh
        run: ./scripts/verify-nsis-assets.ps1
      - name: Run native SQLite and teacher authentication tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Publish installer as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scoolabs-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Attach installer to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
